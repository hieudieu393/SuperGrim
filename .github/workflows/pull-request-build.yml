name: Pull Request Build

on:
  pull_request:
    branches: [2.0]

permissions:
  contents: read

concurrency:
  group: pull-request-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -PmavenLocalOverride=false

      - name: Verify Bukkit artifact and test reports
        run: python3 scripts/verify_bukkit_build.py

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v6
        with:
          name: supergrim-bukkit
          path: bukkit/build/libs/supergrim-bukkit-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supergrim-test-reports
          path: common/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
